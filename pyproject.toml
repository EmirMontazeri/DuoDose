[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-dose"
version = "0.1.0"
description = "Reproducible frozen-VAE and two-coordinate MDN inverse drug-dose prediction"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "torch>=2.5,<3", "scipy>=1.14,<2",
  "pyarrow>=18,<26", "PyYAML>=6,<7", "openpyxl>=3.1,<4",
  "rdkit>=2024.9", "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
reverse-dose = "reverse_dose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Workbook contains no default style:UserWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
